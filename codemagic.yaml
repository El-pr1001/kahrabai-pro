workflows:
  android-workflow:
    name: Android APK
    instance_type: linux
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug --flavor android-proc -t lib/main_android.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/*.apk
