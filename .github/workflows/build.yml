name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix missing android files
        run: |
          flutter create . --platforms=android --project-name kahrabai_pro --org com.kahrabai.pro
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kahrabai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
