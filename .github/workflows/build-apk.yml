name: Build APK - كهربائي برو
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Fix Gradle - Create Android project
        run: |
          flutter create . --platforms=android --project-name kahrabai_pro --org com.kahrabai.pro
          flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kahrabai-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
