workflows:
  android-workflow:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: 3.32.8
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug --flavor android-proc -t lib/main_android.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
